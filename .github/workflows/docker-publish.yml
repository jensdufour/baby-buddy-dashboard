name: Publish Docker image

# Builds the standalone (non-Home-Assistant) image for linux/amd64 and
# linux/arm64 and pushes it to Docker Hub as :latest and :<version>, where
# <version> is read from baby-buddy-dashboard/config.yaml.
#
# Requires two repository secrets:
#   DOCKERHUB_USERNAME - Docker Hub account name
#   DOCKERHUB_TOKEN    - Docker Hub access token with read/write scope

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - baby-buddy-dashboard/backend/**
      - baby-buddy-dashboard/frontend/**
      - baby-buddy-dashboard/config.yaml
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

env:
  IMAGE: mbentancour/baby-buddy-dashboard

jobs:
  publish:
    if: github.repository == 'mbentancour/baby-buddy-dashboard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read add-on version
        id: version
        run: |
          version=$(sed -n 's/^version: *"\([^"]*\)".*/\1/p' baby-buddy-dashboard/config.yaml)
          if [ -z "$version" ]; then
            echo "Could not read version from baby-buddy-dashboard/config.yaml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Skip the provenance attestation so the manifest list only contains
          # real platforms (no confusing "unknown/unknown" entry).
          provenance: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
